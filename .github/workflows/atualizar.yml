name: Atualizar edição

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada ~30 min (economiza cota de Actions do repo privado)
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-edicao
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar edição
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python atualizar.py

      - name: Commitar mudanças
        run: |
          git config user.name "jornal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add acesso-jornal/ data/
          if git diff --staged --quiet; then
            echo "Nada mudou nesta rodada."
          else
            git commit -m "Atualiza edição"
            git push
          fi

      - name: Forçar deploy na Vercel (via Deploy Hook)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Deploy Vercel disparado." || echo "Falha ao disparar deploy."
          else
            echo "Secret VERCEL_DEPLOY_HOOK nao configurado; pulando disparo manual."
          fi
